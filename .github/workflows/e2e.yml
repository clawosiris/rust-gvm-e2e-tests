name: Community E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "baselines/**"
      - "contracts/**"
      - "coverage/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"
      - "docker/**"
      - "docs/**"
      - "fixtures/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "23 3 * * *"
  repository_dispatch:
    types: [component-updated]
  workflow_dispatch:
    inputs:
      lane:
        description: Community lane to run
        required: true
        type: choice
        default: devel-fast
        options:
          - devel-fast
          - devel-scan
          - devel-isolated
          - devel-transport
          - differential
          - all
      rust-gvm-ref:
        description: Exact canonical rust-gvm commit SHA (defaults to the reviewed pin)
        required: true
        type: string
        default: 3039246a1835954287ddbe5817f067addb4a059e
      gvm-rools-ref:
        description: gvm-rools ref for CLI/differential validation
        required: true
        type: string
        default: main
      gvm-version:
        description: Community runtime image tag
        required: true
        type: string
        default: stable
      gvmd-version:
        description: Optional gvmd-only image tag for source-specific regression qualification
        required: false
        type: string
        default: ""
      gvmd-image:
        description: Optional full gvmd image reference (overrides gvmd-version)
        required: false
        type: string
        default: ""
      clean:
        description: Explicitly destroy the selected lane volumes first
        required: false
        type: boolean
        default: false

concurrency:
  group: rust-gvm-e2e-shared-compose-state
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COMPOSE_FILE: docker/docker-compose.yml
  RUNNER_IMAGE_NAME: rust-gvm-e2e-runner
  RUNNER_IMAGE_TAG: ci
  RUST_GVM_SHA: 3039246a1835954287ddbe5817f067addb4a059e
  GVMD_VERSION: ${{ inputs.gvmd-version }}
  GVMD_IMAGE: ${{ inputs.gvmd-image }}

jobs:
  resolve-refs:
    name: Resolve exact component revisions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust-gvm-ref: ${{ steps.refs.outputs.rust-gvm-ref }}
      rust-gvm-sha: ${{ steps.refs.outputs.rust-gvm-sha }}
      gvm-rools-ref: ${{ steps.refs.outputs.gvm-rools-ref }}
      gvm-version: ${{ steps.refs.outputs.gvm-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Resolve immutable rust-gvm candidate
        id: refs
        env:
          DISPATCH_RUST_GVM_REF: ${{ inputs.rust-gvm-ref }}
          DISPATCH_GVM_ROOLS_REF: ${{ inputs.gvm-rools-ref }}
          DISPATCH_GVM_VERSION: ${{ inputs.gvm-version }}
          PAYLOAD_COMPONENT: ${{ github.event.client_payload.component }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_GVM_VERSION: ${{ github.event.client_payload['gvm-version'] }}
        run: |
          python3 tools/resolve_component_refs.py \
            --event-name "${{ github.event_name }}" \
            --default-rust-gvm-sha "${RUST_GVM_SHA}" \
            --dispatch-rust-gvm-ref "${DISPATCH_RUST_GVM_REF}" \
            --dispatch-gvm-rools-ref "${DISPATCH_GVM_ROOLS_REF}" \
            --dispatch-gvm-version "${DISPATCH_GVM_VERSION}" \
            --payload-component "${PAYLOAD_COMPONENT}" \
            --payload-ref "${PAYLOAD_REF}" \
            --payload-gvm-version "${PAYLOAD_GVM_VERSION}" \
            >> "${GITHUB_OUTPUT}"
      - name: Verify candidate exists in canonical rust-gvm
        env:
          RESOLVED_RUST_GVM_SHA: ${{ steps.refs.outputs.rust-gvm-sha }}
        run: |
          git init -q /tmp/rust-gvm
          git -C /tmp/rust-gvm remote add origin https://github.com/greenbone-hive/rust-gvm.git
          git -C /tmp/rust-gvm fetch --depth 1 origin "${RESOLVED_RUST_GVM_SHA}"
          git -C /tmp/rust-gvm checkout --detach FETCH_HEAD
          test "$(git -C /tmp/rust-gvm rev-parse HEAD)" = "${RESOLVED_RUST_GVM_SHA}"

  inventory:
    name: Community coverage inventory
    needs: resolve-refs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESOLVED_RUST_GVM_SHA: ${{ needs.resolve-refs.outputs.rust-gvm-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Fetch exact rust-gvm source under test
        run: |
          git init -q /tmp/rust-gvm
          git -C /tmp/rust-gvm remote add origin https://github.com/greenbone-hive/rust-gvm.git
          git -C /tmp/rust-gvm fetch --depth 1 origin "${RESOLVED_RUST_GVM_SHA}"
          git -C /tmp/rust-gvm checkout --detach FETCH_HEAD
          test "$(git -C /tmp/rust-gvm rev-parse HEAD)" = "${RESOLVED_RUST_GVM_SHA}"
      - name: Verify generated inventory and source tests
        run: |
          python3 tools/coverage_manifest.py --check \
            --rust-gvm-source /tmp/rust-gvm \
            --policy-rust-gvm-sha "${RUST_GVM_SHA}"
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/prepare_rust_gvm_candidate.py \
            --workspace-manifest Cargo.toml \
            --library-manifest tests/library/Cargo.toml \
            --lockfile Cargo.lock \
            --sha "${RESOLVED_RUST_GVM_SHA}"
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          bash -n docker/scripts/*.sh tests/cli/*.sh
          bash docker/scripts/test-community-lane-artifacts.sh
          bash docker/scripts/test-deployment-lane-artifacts.sh
          docker compose -f "${COMPOSE_FILE}" config --quiet
          python3 tools/validate_compose_workspace.py \
            --compose-file "${COMPOSE_FILE}" \
            --expected-workspace "$(pwd -P)"

  build-runner:
    name: Build Community runner
    needs: [resolve-refs, inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      rust-gvm-ref: ${{ steps.refs.outputs.rust-gvm-ref }}
      rust-gvm-sha: ${{ steps.refs.outputs.rust-gvm-sha }}
      gvm-rools-ref: ${{ steps.refs.outputs.gvm-rools-ref }}
      gvm-version: ${{ steps.refs.outputs.gvm-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Export resolved component revisions
        id: refs
        env:
          RESOLVED_RUST_GVM_REF: ${{ needs.resolve-refs.outputs.rust-gvm-ref }}
          RESOLVED_RUST_GVM_SHA: ${{ needs.resolve-refs.outputs.rust-gvm-sha }}
          RESOLVED_GVM_ROOLS_REF: ${{ needs.resolve-refs.outputs.gvm-rools-ref }}
          RESOLVED_GVM_VERSION: ${{ needs.resolve-refs.outputs.gvm-version }}
        run: |
          {
            echo "rust-gvm-ref=${RESOLVED_RUST_GVM_REF}"
            echo "rust-gvm-sha=${RESOLVED_RUST_GVM_SHA}"
            echo "gvm-rools-ref=${RESOLVED_GVM_ROOLS_REF}"
            echo "gvm-version=${RESOLVED_GVM_VERSION}"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runner at exact rust-gvm revision
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.runner
          tags: ${{ env.RUNNER_IMAGE_NAME }}:${{ env.RUNNER_IMAGE_TAG }}
          outputs: type=docker,dest=runner-image.tar
          build-args: |
            RUST_GVM_SHA=${{ steps.refs.outputs.rust-gvm-sha }}
            GVM_ROOLS_REF=${{ steps.refs.outputs.gvm-rools-ref }}
          secrets: |
            github_token=${{ secrets.RELEASE_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: community-runner-${{ github.run_id }}
          path: runner-image.tar
          retention-days: 1

  devel-fast:
    name: Community E2E (devel-fast)
    needs: build-runner
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.lane == 'devel-fast' || inputs.lane == 'all'))
    runs-on: [self-hosted]
    timeout-minutes: 420
    env:
      GVM_VERSION: ${{ needs.build-runner.outputs.gvm-version }}
      E2E_RUST_GVM_SHA: ${{ needs.build-runner.outputs.rust-gvm-sha }}
      E2E_CLEAN_VOLUMES: ${{ inputs.clean && '1' || '0' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: community-runner-${{ github.run_id }}
          path: ${{ runner.temp }}/community-runner-${{ github.run_id }}
      - name: Load exact Community runner image
        id: runner-image
        run: |
          runner_tar="${RUNNER_TEMP}/community-runner-${GITHUB_RUN_ID}/runner-image.tar"
          docker load --input "${runner_tar}"
          runner_image_id="$(docker image inspect --format '{{.Id}}' "${RUNNER_IMAGE_NAME}:${RUNNER_IMAGE_TAG}")"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${runner_image_id}")" = "${E2E_RUST_GVM_SHA}"
          printf 'image-id=%s\n' "${runner_image_id}" >> "${GITHUB_OUTPUT}"
          rm -f -- "${runner_tar}"
      - name: Restore artifacts directory ownership
        env:
          RUNNER_IMAGE_ID: ${{ steps.runner-image.outputs.image-id }}
        run: |
          artifacts_dir="${GITHUB_WORKSPACE}/artifacts"
          if [[ -d "${artifacts_dir}" && ! -L "${artifacts_dir}" ]]; then
            host_uid="$(id -u)"
            host_gid="$(id -g)"
            docker run --rm --user 0:0 \
              --mount "type=bind,src=${artifacts_dir},dst=/workspace/artifacts" \
              --entrypoint /bin/chown \
              "${RUNNER_IMAGE_ID}" "${host_uid}:${host_gid}" /workspace/artifacts
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          clean: false
      - run: bash docker/scripts/run-deployment-lane.sh devel-fast
      - if: failure()
        run: docker compose -f "${COMPOSE_FILE}" logs --tail=250 gvmd ospd-openvas openvasd pg-gvm
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: community-devel-fast-results-${{ github.run_id }}
          path: |
            artifacts/
            coverage/manifest.json

  devel-scan:
    name: Community E2E (devel-scan)
    needs: build-runner
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.lane == 'devel-scan' || inputs.lane == 'all'))
    runs-on: [self-hosted]
    timeout-minutes: 420
    env:
      GVM_VERSION: ${{ needs.build-runner.outputs.gvm-version }}
      E2E_RUST_GVM_SHA: ${{ needs.build-runner.outputs.rust-gvm-sha }}
      E2E_CLEAN_VOLUMES: ${{ inputs.clean && '1' || '0' }}
      E2E_TASK_PROGRESS_TIMEOUT_SECS: 1800
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: community-runner-${{ github.run_id }}
          path: ${{ runner.temp }}/community-runner-${{ github.run_id }}
      - name: Load exact Community runner image
        id: runner-image
        run: |
          runner_tar="${RUNNER_TEMP}/community-runner-${GITHUB_RUN_ID}/runner-image.tar"
          docker load --input "${runner_tar}"
          runner_image_id="$(docker image inspect --format '{{.Id}}' "${RUNNER_IMAGE_NAME}:${RUNNER_IMAGE_TAG}")"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${runner_image_id}")" = "${E2E_RUST_GVM_SHA}"
          printf 'image-id=%s\n' "${runner_image_id}" >> "${GITHUB_OUTPUT}"
          rm -f -- "${runner_tar}"
      - name: Restore artifacts directory ownership
        env:
          RUNNER_IMAGE_ID: ${{ steps.runner-image.outputs.image-id }}
        run: |
          artifacts_dir="${GITHUB_WORKSPACE}/artifacts"
          if [[ -d "${artifacts_dir}" && ! -L "${artifacts_dir}" ]]; then
            host_uid="$(id -u)"
            host_gid="$(id -g)"
            docker run --rm --user 0:0 \
              --mount "type=bind,src=${artifacts_dir},dst=/workspace/artifacts" \
              --entrypoint /bin/chown \
              "${RUNNER_IMAGE_ID}" "${host_uid}:${host_gid}" /workspace/artifacts
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          clean: false
      - run: bash docker/scripts/run-deployment-lane.sh devel-scan
      - if: failure()
        run: docker compose -f "${COMPOSE_FILE}" logs --tail=350 gvmd ospd-openvas openvasd pg-gvm scan-fixture
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: community-devel-scan-results-${{ github.run_id }}
          path: |
            artifacts/
            coverage/manifest.json

  devel-isolated:
    name: Community E2E (devel-isolated)
    needs: [build-runner, devel-scan]
    if: >-
      always() && needs.build-runner.result == 'success' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.lane == 'devel-isolated' || inputs.lane == 'all')))
    runs-on: [self-hosted]
    timeout-minutes: 420
    env:
      GVM_VERSION: ${{ needs.build-runner.outputs.gvm-version }}
      E2E_RUST_GVM_SHA: ${{ needs.build-runner.outputs.rust-gvm-sha }}
      E2E_CLEAN_VOLUMES: ${{ inputs.clean && '1' || '0' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: community-runner-${{ github.run_id }}
          path: ${{ runner.temp }}/community-runner-${{ github.run_id }}
      - name: Load exact Community runner image
        id: runner-image
        run: |
          runner_tar="${RUNNER_TEMP}/community-runner-${GITHUB_RUN_ID}/runner-image.tar"
          docker load --input "${runner_tar}"
          runner_image_id="$(docker image inspect --format '{{.Id}}' "${RUNNER_IMAGE_NAME}:${RUNNER_IMAGE_TAG}")"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${runner_image_id}")" = "${E2E_RUST_GVM_SHA}"
          printf 'image-id=%s\n' "${runner_image_id}" >> "${GITHUB_OUTPUT}"
          rm -f -- "${runner_tar}"
      - name: Restore artifacts directory ownership
        env:
          RUNNER_IMAGE_ID: ${{ steps.runner-image.outputs.image-id }}
        run: |
          artifacts_dir="${GITHUB_WORKSPACE}/artifacts"
          if [[ -d "${artifacts_dir}" && ! -L "${artifacts_dir}" ]]; then
            host_uid="$(id -u)"
            host_gid="$(id -g)"
            docker run --rm --user 0:0 \
              --mount "type=bind,src=${artifacts_dir},dst=/workspace/artifacts" \
              --entrypoint /bin/chown \
              "${RUNNER_IMAGE_ID}" "${host_uid}:${host_gid}" /workspace/artifacts
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          clean: false
      - run: bash docker/scripts/run-deployment-lane.sh devel-isolated
      - if: failure()
        run: COMPOSE_PROJECT_NAME=rust-gvm-e2e-isolated docker compose -f "${COMPOSE_FILE}" logs --tail=350 gvmd pg-gvm
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: community-devel-isolated-results-${{ github.run_id }}
          path: |
            artifacts/
            coverage/manifest.json

  devel-transport:
    name: Community E2E (devel-transport)
    needs: build-runner
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.lane == 'devel-transport' || inputs.lane == 'all')
    runs-on: [self-hosted]
    timeout-minutes: 420
    env:
      GVM_VERSION: ${{ needs.build-runner.outputs.gvm-version }}
      E2E_RUST_GVM_SHA: ${{ needs.build-runner.outputs.rust-gvm-sha }}
      E2E_TLS_HOST: ${{ secrets.E2E_TLS_HOST }}
      E2E_TLS_PORT: ${{ secrets.E2E_TLS_PORT }}
      E2E_TLS_SERVER_NAME: ${{ secrets.E2E_TLS_SERVER_NAME }}
      E2E_TLS_CA_PATH: ${{ secrets.E2E_TLS_CA_PATH }}
      E2E_MTLS_HOST: ${{ secrets.E2E_MTLS_HOST }}
      E2E_MTLS_PORT: ${{ secrets.E2E_MTLS_PORT }}
      E2E_MTLS_SERVER_NAME: ${{ secrets.E2E_MTLS_SERVER_NAME }}
      E2E_MTLS_CA_PATH: ${{ secrets.E2E_MTLS_CA_PATH }}
      E2E_MTLS_CERT_PATH: ${{ secrets.E2E_MTLS_CERT_PATH }}
      E2E_MTLS_KEY_PATH: ${{ secrets.E2E_MTLS_KEY_PATH }}
      E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
      E2E_SSH_PORT: ${{ secrets.E2E_SSH_PORT }}
      E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
      E2E_SSH_PASSWORD: ${{ secrets.E2E_SSH_PASSWORD }}
      E2E_SSH_KEY_PATH: ${{ secrets.E2E_SSH_KEY_PATH }}
      E2E_SSH_KEY_PASSPHRASE: ${{ secrets.E2E_SSH_KEY_PASSPHRASE }}
      E2E_SSH_SOCKET_PATH: ${{ secrets.E2E_SSH_SOCKET_PATH }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: community-runner-${{ github.run_id }}
          path: ${{ runner.temp }}/community-runner-${{ github.run_id }}
      - name: Load exact Community runner image
        id: runner-image
        run: |
          runner_tar="${RUNNER_TEMP}/community-runner-${GITHUB_RUN_ID}/runner-image.tar"
          docker load --input "${runner_tar}"
          runner_image_id="$(docker image inspect --format '{{.Id}}' "${RUNNER_IMAGE_NAME}:${RUNNER_IMAGE_TAG}")"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${runner_image_id}")" = "${E2E_RUST_GVM_SHA}"
          printf 'image-id=%s\n' "${runner_image_id}" >> "${GITHUB_OUTPUT}"
          rm -f -- "${runner_tar}"
      - name: Restore artifacts directory ownership
        env:
          RUNNER_IMAGE_ID: ${{ steps.runner-image.outputs.image-id }}
        run: |
          artifacts_dir="${GITHUB_WORKSPACE}/artifacts"
          if [[ -d "${artifacts_dir}" && ! -L "${artifacts_dir}" ]]; then
            host_uid="$(id -u)"
            host_gid="$(id -g)"
            docker run --rm --user 0:0 \
              --mount "type=bind,src=${artifacts_dir},dst=/workspace/artifacts" \
              --entrypoint /bin/chown \
              "${RUNNER_IMAGE_ID}" "${host_uid}:${host_gid}" /workspace/artifacts
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          clean: false
      - run: bash docker/scripts/run-deployment-lane.sh devel-transport
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: community-devel-transport-results-${{ github.run_id }}
          path: |
            artifacts/
            coverage/manifest.json

  differential:
    name: Community E2E (differential)
    needs: build-runner
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.lane == 'differential' || inputs.lane == 'all')
    runs-on: [self-hosted]
    timeout-minutes: 420
    env:
      GVM_VERSION: ${{ needs.build-runner.outputs.gvm-version }}
      E2E_RUST_GVM_SHA: ${{ needs.build-runner.outputs.rust-gvm-sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: community-runner-${{ github.run_id }}
          path: ${{ runner.temp }}/community-runner-${{ github.run_id }}
      - name: Load exact Community runner image
        id: runner-image
        run: |
          runner_tar="${RUNNER_TEMP}/community-runner-${GITHUB_RUN_ID}/runner-image.tar"
          docker load --input "${runner_tar}"
          runner_image_id="$(docker image inspect --format '{{.Id}}' "${RUNNER_IMAGE_NAME}:${RUNNER_IMAGE_TAG}")"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${runner_image_id}")" = "${E2E_RUST_GVM_SHA}"
          printf 'image-id=%s\n' "${runner_image_id}" >> "${GITHUB_OUTPUT}"
          rm -f -- "${runner_tar}"
      - name: Restore artifacts directory ownership
        env:
          RUNNER_IMAGE_ID: ${{ steps.runner-image.outputs.image-id }}
        run: |
          artifacts_dir="${GITHUB_WORKSPACE}/artifacts"
          if [[ -d "${artifacts_dir}" && ! -L "${artifacts_dir}" ]]; then
            host_uid="$(id -u)"
            host_gid="$(id -g)"
            docker run --rm --user 0:0 \
              --mount "type=bind,src=${artifacts_dir},dst=/workspace/artifacts" \
              --entrypoint /bin/chown \
              "${RUNNER_IMAGE_ID}" "${host_uid}:${host_gid}" /workspace/artifacts
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          clean: false
      - run: bash docker/scripts/run-deployment-lane.sh differential
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: community-differential-results-${{ github.run_id }}
          path: |
            artifacts/
            coverage/manifest.json
