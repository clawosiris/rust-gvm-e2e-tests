[package]
name = "gvm-community-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
gvm-client = { git = "https://github.com/greenbone-hive/rust-gvm.git", branch = "devel" }
gvm-connection = { git = "https://github.com/greenbone-hive/rust-gvm.git", branch = "devel", features = ["ssh", "tls"] }
gvm-gmp = { git = "https://github.com/greenbone-hive/rust-gvm.git", branch = "devel" }
gvm-protocol = { git = "https://github.com/greenbone-hive/rust-gvm.git", branch = "devel" }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "time"] }
