[package]
name = "gvm-community-e2e"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
base64 = "0.23"
gvm-client = { git = "https://github.com/greenbone-hive/rust-gvm.git", rev = "8ea68a82636974256b2c198ea24a5aa26262b659" }
gvm-connection = { git = "https://github.com/greenbone-hive/rust-gvm.git", rev = "8ea68a82636974256b2c198ea24a5aa26262b659", features = ["ssh", "tls"] }
gvm-gmp = { git = "https://github.com/greenbone-hive/rust-gvm.git", rev = "8ea68a82636974256b2c198ea24a5aa26262b659" }
gvm-protocol = { git = "https://github.com/greenbone-hive/rust-gvm.git", rev = "8ea68a82636974256b2c198ea24a5aa26262b659" }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "time"] }
