[package]
name = "gvm-community-e2e"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
base64 = "0.23"
gvm-client = { git = "https://github.com/greenbone-hive/rust-gvm.git", rev = "3039246a1835954287ddbe5817f067addb4a059e" }
gvm-connection = { git = "https://github.com/greenbone-hive/rust-gvm.git", rev = "3039246a1835954287ddbe5817f067addb4a059e", features = ["ssh", "tls"] }
gvm-gmp = { git = "https://github.com/greenbone-hive/rust-gvm.git", rev = "3039246a1835954287ddbe5817f067addb4a059e" }
gvm-protocol = { git = "https://github.com/greenbone-hive/rust-gvm.git", rev = "3039246a1835954287ddbe5817f067addb4a059e" }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "time"] }
